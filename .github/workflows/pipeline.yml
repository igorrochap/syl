name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Vet
        run: go vet ./...

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test installer
        run: scripts/install_test.sh

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  build:
    name: Build ${{ matrix.release_os }}/${{ matrix.goarch }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-release.outputs.released == 'true'
    needs: [checks, prepare-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            release_os: Linux
          - goos: linux
            goarch: arm64
            release_os: Linux
          - goos: darwin
            goarch: amd64
            release_os: Darwin
          - goos: darwin
            goarch: arm64
            release_os: Darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/package
          version="${{ needs.prepare-release.outputs.tag }}"
          commit="$(git rev-parse --short=7 HEAD)"
          go build -trimpath -ldflags="-s -w -X github.com/igorrochap/syl/internal/version.Version=${version} -X github.com/igorrochap/syl/internal/version.Commit=${commit}" -o dist/package/syl ./cmd/syl
          tar -C dist/package -czf "dist/syl_${{ matrix.release_os }}_${GOARCH}.tar.gz" syl

      - name: Store release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  prepare-release:
    name: Prepare semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create semantic release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-release.outputs.released == 'true'
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Upload release archives
        uses: python-semantic-release/publish-action@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.prepare-release.outputs.tag }}
