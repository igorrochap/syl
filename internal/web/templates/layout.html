{{define "layout-start"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="syl-token" content="{{.Token}}">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/style.css">{{if .ConfigStyles}}
<link rel="stylesheet" href="/assets/config.css">{{end}}
</head>
<body class="syl syl-dark">{{template "header" .}}<main{{if .MainClass}} class="{{.MainClass}}"{{end}}>
{{end}}

{{define "layout-main-end"}}</main>
{{end}}

{{define "layout-end"}}
{{template "layout-main-end" .}}<script src="/assets/htmx.min.js"></script>
<script>
(function(){
  var root=document.body;
  window.setTheme=function(theme){
    root.classList.toggle('syl-light',theme==='light');
    root.classList.toggle('syl-dark',theme!=='light');
    var button=document.querySelector('.theme-toggle');
    if(button){button.querySelector('span').textContent=theme==='light'?'Light':'Dark';button.setAttribute('aria-label',theme==='light'?'Switch to dark theme':'Switch to light theme');}
  };
  window.toggleTheme=function(){var light=root.classList.contains('syl-light');var theme=light?'dark':'light';setTheme(theme);localStorage.setItem('syl-theme',theme);};
  var saved=localStorage.getItem('syl-theme');
  if(saved==='light'){setTheme('light');}{{if eq .CopyMode "path"}}
  document.addEventListener('click',function(event){
    var button=event.target.closest('[data-copy-path]');
    if(!button){return;}
    navigator.clipboard.writeText(button.getAttribute('data-copy-path')).then(function(){button.textContent='Copied';window.setTimeout(function(){button.textContent='Copy path';},1200);});
  });
{{else if eq .CopyMode "command"}}
  document.addEventListener('click',function(event){
    var button=event.target.closest('[data-copy-command]');
    if(!button){return;}
    navigator.clipboard.writeText(button.getAttribute('data-copy-command')).then(function(){button.textContent='Copied';window.setTimeout(function(){button.textContent='Copy command';},1200);});
  });
{{else}}
{{end}}}());
</script>
{{template "layout-document-end" .}}{{end}}

{{define "layout-document-end"}}</body>
</html>
{{end}}
