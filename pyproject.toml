[project]
name = "syl"
version = "1.5.0"

[tool.setuptools]
packages = []

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = ""
tag_format = "v{version}"
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "chore", "docs", "style", "test", "ci", "build", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ["^chore\\(release\\)"]

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*.tar.gz", "dist/checksums.txt"]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"
